<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found</title>
<!-- Served at any depth and on two hosts with different roots (Firebase "/", GitHub Pages
     "/imangostudio/"), so it can't link theme.css by a relative path. The tokens below are a copy of
     theme.css: change both together. -->
<style>
	:root { --bg: #f2f6fc; --panel: #ffffff; --text: #1b2533; --muted: #5f6b7a; --accent: #0d6fd8; --accent-text: #ffffff; --line: #d6e2f2; color-scheme: light; }
	@media (prefers-color-scheme: dark) {
		:root { --bg: #0f141b; --panel: #18202a; --text: #e6edf5; --muted: #9aa8b8; --accent: #6fb2ff; --accent-text: #18202a; --line: #2a3644; color-scheme: dark; }
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	main { max-width: 460px; margin: 0 auto; padding: 64px 16px; }
	section { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; text-align: center; }
	.code { color: var(--accent); font-weight: 700; margin: 0; }
	h1 { font-size: 1.4rem; margin: 4px 0 8px; }
	p { color: var(--muted); margin: 0 0 22px; }
	.btn { display: inline-block; padding: 9px 18px; border-radius: 999px; background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
	<section>
		<p class="code">404</p>
		<h1>Page not found</h1>
		<p>This page doesn't exist. Check the address, or head back to the studio home page.</p>
		<a class="btn" id="home" href="/">iMango Studio home</a>
	</section>
</main>
<script>
	// GitHub Pages serves the site under /imangostudio/, Firebase at the root.
	if (location.pathname.indexOf('/imangostudio/') === 0) document.getElementById('home').href = '/imangostudio/';
</script>
</body>
</html>
